[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-hedge-analytics"
version = "0.1.0"
description = "Fund-level FX risk analytics (IRR, NAV) and hedge recommendations"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "openpyxl>=3.1", "pyxirr>=0.10"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fx-hedge = "fx_hedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]